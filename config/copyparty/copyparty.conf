[global]
  p: 8086
  e2dsa     # scan files on startup
  e2ts      # enable metadata indexing
  shr: /share
  hist: ~/.cache/copyparty
  rp-loc: /copyparty/
  rproxy: 1

[/Pictures]
  /mnt/storagebox/Pictures/
  accs:
    rw: maaike
  flags:
    grid
